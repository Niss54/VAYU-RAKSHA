name: VAYU-RAKSHA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python-agents:
    name: 5-Agent LangGraph & Cascade Physics Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx pytest httpx pydantic
      - name: Run VAYU-RAKSHA Engine Tests
        run: pytest tests/ -v

  build-nextjs-hud:
    name: Next.js 16 Tactical Command Center Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript Validation
        run: npm run typecheck
      - name: Next.js Production Build
        run: npx next build
