[project]
name = "shadowcast-archiver"
version = "0.1.0"
description = "Snapshots cyclone forecasts and official alerts (GDACS, NDMA SACHET, IBTrACS, WeatherNext 2) into Cloud Storage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
]

[project.scripts]
shadowcast-archiver = "shadowcast_archiver.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowcast_archiver"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "D"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLR0917"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=shadowcast_archiver --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/__main__.py"]
