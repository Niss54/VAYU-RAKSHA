<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ShadowCast: Forecasts say where a cyclone goes. ShadowCast says what it will break, and proves it by satellite.">
  <defs>
    <radialGradient id="lit" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFE2B0"/><stop offset="1" stop-color="#F28A2E"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F28A2E" stop-opacity="0.28"/><stop offset="1" stop-color="#F28A2E" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#F28A2E" stop-opacity="0"/><stop offset="1" stop-color="#F28A2E" stop-opacity="0.9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#0e1012"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
