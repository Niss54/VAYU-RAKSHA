    <!-- text -->
    <text x="340" y="112" fill="#F28A2E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="3.5">IMPACT FORECAST &#183; PROVEN BY SATELLITE</text>
    <text x="336" y="186" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5">ShadowCast</text>
