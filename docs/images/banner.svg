    <text x="340" y="272" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25">ShadowCast says <tspan fill="#F28A2E" font-weight="600">what it will break</tspan> &#8212; and proves it by satellite.</text>
    <rect x="340" y="304" width="220" height="2" fill="url(#fade)" transform="rotate(180 450 305)"/>
    <text x="340" y="330" fill="#6F737B" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="2">BUILD WITH AI: CODE FOR COMMUNITIES &#183; TRACK 5 &#183; CYCLONE IMPACT</text>
