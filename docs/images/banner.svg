      <circle cx="1060" cy="262" r="2" opacity="0.5"/><circle cx="1150" cy="176" r="2" opacity="0.6"/><circle cx="1045" cy="276" r="2" opacity="0.4"/>
      <circle cx="1104" cy="245" r="2.5" opacity="0.7"/><circle cx="1120" cy="242" r="2" opacity="0.55"/><circle cx="1142" cy="214" r="2.5" opacity="0.65"/>
      <circle cx="1165" cy="160" r="1.8" opacity="0.5"/><circle cx="1030" cy="292" r="1.6" opacity="0.35"/><circle cx="1180" cy="146" r="1.6" opacity="0.4"/>
    </g>
    <circle cx="1112" cy="222" r="34" fill="none" stroke="#F28A2E" stroke-opacity="0.55" stroke-width="1.5"/>
