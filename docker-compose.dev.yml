# ==============================================================================
# 🌪️ VAYU-RAKSHA — Docker Compose (Local Development with Hot-Reloading)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: deps
    container_name: vayu_raksha_web_dev
    command: npm run dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000

  geo:
    container_name: vayu_raksha_geo_dev
    command: ["sh", "-c", "exec uvicorn shadowcast_geo.api:create_app --factory --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./services/geo/src:/app/src
